name: ios-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap pre-flight on Linux — catches "someone moved/deleted a top-level
  # directory" in seconds instead of waiting for the macOS job.
  #
  # ⚠️ Every path asserted here must exist on disk. The previous version of this
  # job asserted `Modules/`, `Services/` and `Resources/` — none of which this
  # repository has ever had — so the job failed on **every push**. That is the
  # kind of assertion nobody notices, because a red check that is always red
  # stops carrying information: people learn to ignore it.
  #
  # The rule is now enforced in both directions by
  # `Tests/.../Repository/RepositoryLayoutTests.swift`: every `test -d/-f/-x`
  # in `.github/workflows/*.yml` must resolve to something real, so a stale
  # assertion cannot come back quietly. Adding a path here without creating it
  # turns `swift test` red on the macOS job.
  repo-structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate expected iOS skeleton
        run: |
          set -euo pipefail
          test -d App          # FluentWorkHost target sources (HostRootView 等)
          test -d Shared       # 全部 SwiftPM target，逐个见 Package.swift 的 path:
          test -d Tests        # FluentWorkCoreTests
          test -d Scripts      # gate.sh 等落地脚本
          test -f Package.swift
          test -f project.yml  # XcodeGen 的工程定义（.xcodeproj 由它生成）
          test -x Scripts/gate.sh
          echo "Repository skeleton is present."

  swift-package-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run package tests
        # 显式声明「这个进程在跑测试」。
        #
        # 不能靠猜运行器：本机 `swift test` 经 `swiftpm-testing-helper` 运行、XCTest 被
        # 加载，而这里 SwiftPM 生成的是一个普通可执行文件
        # （`.build/…/FluentWorkIOSPackageTests.derived/runner.swift`）——
        # `XCTestCase` 解析不出来、`XCTestConfigurationFilePath` 也没设，于是测试进程
        # 会被当成生产进程，去构造真的 `AVAudioEngine`（2026-09-29 实测：
        # `AudioEngineResolutionTests` 与 `MockAudioEngineTests` 在本机绿、在这里红）。
        #
        # 这一行让判据从「猜运行器」变成「运行测试的人自己说」。
        env:
          FLUENTWORK_TEST_PROCESS: "1"
        run: swift test
