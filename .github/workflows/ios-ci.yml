name: ios-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate expected iOS skeleton
        run: |
          set -euo pipefail
          test -d App
          test -d Modules
          test -d Shared
          test -d Services
          test -d Resources
          test -d Tests
          test -f Package.swift
          echo "Repository skeleton is present."

  swift-package-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run package tests
        run: swift test
