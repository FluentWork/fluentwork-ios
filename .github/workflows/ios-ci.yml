name: ios-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate expected iOS skeleton
        run: |
          set -euo pipefail
          test -d App
          test -d Modules
          test -d Shared
          test -d Services
          test -d Resources
          test -d Tests
          echo "Repository skeleton is present."

  build-and-test-placeholder:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect project files
        id: detect
        run: |
          if find . -maxdepth 2 \( -name '*.xcodeproj' -o -name 'Package.swift' \) | grep -q .; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Placeholder notice
        if: steps.detect.outputs.has_project == 'false'
        run: echo "No Xcode project or Package.swift yet. Skipping build/test until app scaffold exists."

      - name: Future build hook
        if: steps.detect.outputs.has_project == 'true'
        run: echo "Project files detected. Replace this placeholder with real iOS build and test commands."
