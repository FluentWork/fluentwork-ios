name: FluentWorkHost
options:
  minimumXcodeGenVersion: 2.46.0
  createIntermediateGroups: true

packages:
  FluentWorkIOS:
    path: .

schemes:
  FluentWorkHost:
    build:
      targets:
        FluentWorkHost: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  FluentWorkHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/FluentWorkHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fluentwork.host
        PRODUCT_NAME: $(TARGET_NAME)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "FluentWork 需要使用麦克风进行语音交互和口语练习"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "FluentWork 需要使用语音识别来实时转录您的口语练习内容"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_VERSION: 6.0
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: FluentWorkIOS
        product: FluentWorkCore
      - package: FluentWorkIOS
        product: FluentWorkUI
